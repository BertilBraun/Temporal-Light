services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: temporal_light
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d temporal_light"]
      interval: 5s
      retries: 5

  migrate:
    build: .
    command: python -m temporal_light.db.migrate
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/temporal_light
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    command: python -m temporal_light.api
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/temporal_light
      API_PORT: ${API_PORT:-8080}
    ports:
      - "${API_PORT:-8080}:${API_PORT:-8080}"
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    build: .
    command: python example/worker_entry.py
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/temporal_light
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
    depends_on:
      migrate:
        condition: service_completed_successfully
    deploy:
      replicas: ${WORKER_REPLICAS:-1}

volumes:
  pgdata:
