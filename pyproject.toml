[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "temporal-light"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.29.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "watchfiles>=0.21.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["temporal_light*"]
